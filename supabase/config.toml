# Supabase CLI configuration.
#
# This project is shared with RiftTrades: FAB Trades owns the fab_* tables plus
# `trades`, and RiftTrades owns the unprefixed equivalents. See README.md in this
# directory before adding migrations.
project_id = "tenrvaghaspwdvnwvgrh"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://fabtrades.net"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Discord is the web app's sign-in provider. Secrets come from the environment so
# they are never committed; see docs/DISCORD_AUTH_SETUP.md.
[auth.external.discord]
enabled = true
client_id = "env(SUPABASE_AUTH_DISCORD_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_DISCORD_SECRET)"
