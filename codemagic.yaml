# Codemagic CI for FAB Trades (Flutter iOS).
# Flutter project lives at apps/mobile — see working_directory below.
#
# Before the first signed upload:
# 1. Create the App Store Connect app record (Apps → + → New App) for bundle ID
#    com.fabtrades.app. That creates the app shell — no binary required yet.
# 2. Upload App Store Connect API key in Codemagic (Team integrations → Developer Portal).
# 3. Add Apple Distribution cert + App Store profile (Code signing identities).
# 4. Match integrations.app_store_connect to the exact API key name in the Codemagic UI.
#
workflows:
  ios-unsigned:
    name: iOS unsigned (debug)
    working_directory: apps/mobile
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        APP_ENVIRONMENT: production
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS debug without code signing
        script: |
          flutter build ios --debug --no-codesign \
            --dart-define-from-file="env/${APP_ENVIRONMENT}.json"
    artifacts:
      - build/ios/iphoneos/**/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: iOS TestFlight
    working_directory: apps/mobile
    max_build_duration: 120
    instance_type: mac_mini_m2

    # One tag ships both stores from the same commit. The Android workflow in
    # .github/workflows/release-android-closed.yml listens for the same pattern, so
    # `git tag mobile-v1.2.0 && git push --tags` is the whole release.
    #
    # Requires the Codemagic webhook to be installed on the repository (App settings
    # → Webhooks); without it Codemagic never hears about the tag. Starting a build
    # from the UI still works and simply skips the tag check below.
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'mobile-v*'
          include: true

    integrations:
      # Must match the name you give the key in Codemagic → Team integrations → Developer Portal
      app_store_connect: codemagickey

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.fabtrades.app
      vars:
        # App Store Connect → App Information → Apple ID
        APP_STORE_APPLE_ID: "6794308687"
        # Which Supabase project the build talks to (apps/mobile/env/*.json).
        # Override per build in the Codemagic UI to ship a staging TestFlight
        # build; sandbox purchases must never write real entitlements.
        APP_ENVIRONMENT: production
      groups:
        # Codemagic → Team/App settings → Environment variables. Holds
        # REVENUECAT_APPLE_API_KEY. Without it the build still succeeds and simply
        # runs with subscriptions switched off, never with the test-store key.
        - revenuecat

    scripts:
      # First, before an hour of Xcode: App Store Connect takes whatever version it
      # is handed, so a tag that disagrees with pubspec.yaml ships silently. Same
      # script the Android workflow runs — a check that lives in only one of the two
      # pipelines is exactly the one that gets skipped.
      - name: Check the tag matches pubspec.yaml
        script: |
          if [ -n "${CM_TAG:-}" ]; then
            bash ../../scripts/check-release-tag.sh "$CM_TAG" pubspec.yaml
          else
            echo "Not a tag build — nothing to check."
          fi

      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles

      # Xcode only notices a profile missing a capability once the archive is
      # already built, and it names the profile without saying which copy it
      # used. Inspect what was actually fetched instead, so a profile predating
      # Sign In with Apple fails here rather than ten minutes later.
      - name: Check fetched profiles against Runner.entitlements
        script: |
          set -e
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          shopt -s nullglob
          found=("$profiles"/*.mobileprovision)
          if [ ${#found[@]} -eq 0 ]; then
            echo "No provisioning profiles were fetched into $profiles"
            exit 1
          fi
          stale=0
          matched=0
          for profile in "${found[@]}"; do
            plist=$(mktemp)
            security cms -D -i "$profile" > "$plist"
            app_id=$(/usr/libexec/PlistBuddy -c \
              'Print :Entitlements:application-identifier' "$plist" 2>/dev/null || true)
            # The machine can hold profiles for other apps on the account; only
            # the ones Xcode could choose between for this target matter.
            case "$app_id" in
              *.com.fabtrades.app) ;;
              *) continue ;;
            esac
            matched=$((matched + 1))
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")
            created=$(/usr/libexec/PlistBuddy -c 'Print :CreationDate' "$plist")
            if /usr/libexec/PlistBuddy -c \
                'Print :Entitlements:com.apple.developer.applesignin' "$plist" >/dev/null 2>&1; then
              echo "ok       $name — $uuid — created $created"
            else
              echo "NO APPLESIGNIN  $name — $uuid — created $created"
              stale=1
            fi
          done
          if [ "$matched" -eq 0 ]; then
            echo "None of the fetched profiles are for com.fabtrades.app — check that an"
            echo "App Store profile for that bundle id is stored in Codemagic Code signing"
            echo "identities."
            exit 1
          fi
          if [ "$stale" -ne 0 ]; then
            echo
            echo "That profile was generated before Sign In with Apple was enabled on the"
            echo "com.fabtrades.app App ID. Enabling a capability does not update profiles"
            echo "that already exist, and this workflow signs with the copy stored in"
            echo "Codemagic rather than whatever the portal holds now, so re-running alone"
            echo "will fetch the same stale file. Regenerate it in the Apple Developer"
            echo "portal, then replace the stored copy under Codemagic — Team settings —"
            echo "codemagic.yaml settings — Code signing identities. See docs/AUTH_PROVIDERS.md."
            exit 1
          fi

      - name: Set build number
        script: |
          # After the first TestFlight upload, this auto-increments. Before that,
          # it falls back so we stay above pubspec's current +4.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || echo 4)
          NEW_BUILD=$((LATEST + 1))
          echo "Using build number: $NEW_BUILD"
          echo "NEW_BUILD=$NEW_BUILD" >> "$CM_ENV"

      - name: Flutter build IPA
        script: |
          set -e
          env_file="env/${APP_ENVIRONMENT}.json"
          # The app refuses to start without this, so catch an unfilled env file here
          # rather than in a tester's crash report.
          grep -q '"SUPABASE_URL": *"http' "$env_file" || {
            echo "$env_file has no SUPABASE_URL — see docs/ENVIRONMENTS.md"
            exit 1
          }
          args=(build ipa --release
            --build-number="$NEW_BUILD"
            --dart-define-from-file="$env_file"
            --export-options-plist=/Users/builder/export_options.plist)
          if [ -n "$REVENUECAT_APPLE_API_KEY" ]; then
            args+=(--dart-define=REVENUECAT_APPLE_API_KEY="$REVENUECAT_APPLE_API_KEY")
          fi
          echo "Building $APP_ENVIRONMENT"
          flutter "${args[@]}"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # The app record exists and internal testing is set up, so builds go straight
        # to TestFlight rather than sitting in App Store Connect waiting for someone
        # to notice them.
        submit_to_testflight: true
        # Still manual. Submitting a build for review is a decision, not a
        # consequence of pushing a tag.
        submit_to_app_store: false
        # External groups need App Review for the first build they receive; add them
        # here once one exists and testing has to reach beyond internal testers.
        # beta_groups:
        #   - Closed testers
