[build]
  # The web app is one workspace in a monorepo; everything below is relative
  # to this base, so Netlify needs no dashboard configuration to find it.
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"
  # Tell Netlify to ignore these environment variables in secret scanning
  # These are Supabase public keys that are safe to expose in client-side code
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

